<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>InFlow Tactile · 機械音量計</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f4f2;
  --fg: #18181a;
  --muted: #72706d;
  --chassis: #202224;
  --chassis-border: #383b3e;
  --led-off: #2c3033;
  --led-green: #2fe085;
  --led-amber: #ffaa1d;
  --led-red: #ff453a;
  --accent: #ff6a00;
  --shadow: rgba(0, 0, 0, 0.28);
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #121314;
  --fg: #ededed;
  --muted: #888888;
  --chassis: #161819;
  --chassis-border: #2c2f32;
  --shadow: rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
}
.preview-stage {
  min-height: 350px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 18px;
  position: relative;
  background: transparent;
}

/* Teenage Engineering / Industrial Hi-Fi Capsule */
.hifi-pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  height: 46px;
  min-width: 250px;
  max-width: 420px;
  padding: 0 16px;
  border-radius: 8px; /* Industrial rounded square */
  background: var(--chassis);
  border: 1px solid var(--chassis-border);
  box-shadow: 0 14px 32px -4px var(--shadow), 0 2px 4px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  color: #fff;
  user-select: none;
  cursor: default;
  gap: 12px;
  transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s ease;
  animation: hifi-appear 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes hifi-appear {
  0% { opacity: 0; transform: scale(0.96) translateY(4px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* REC Marker with tactile LED */
.rec-section {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.rec-led {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--led-off);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  transition: background 0.15s ease, box-shadow 0.15s ease;
}
.hifi-pill[data-state=listening] .rec-led {
  background: var(--led-red);
  box-shadow: 0 0 8px var(--led-red);
  animation: rec-blink 1.4s steps(1) infinite;
}
@keyframes rec-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.rec-label {
  color: #a0a5aa;
  font-size: 10.5px;
}
.hifi-pill[data-state=listening] .rec-label { color: #fff; }

/* Status Text display */
.display-section {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #e2e4e6;
}

/* Segmented LED Peak Meter (Teenage Engineering Style) */
.meter-array {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 18px;
  padding: 3px 6px;
  background: #111314;
  border-radius: 4px;
  border: 1px solid #282a2d;
}
.led-bar {
  width: 4px;
  height: 12px;
  border-radius: 1px;
  background: var(--led-off);
  transition: background 0.08s ease;
}
.led-bar.lit-green {
  background: var(--led-green);
  box-shadow: 0 0 5px rgba(47, 224, 133, 0.7);
}
.led-bar.lit-amber {
  background: var(--led-amber);
  box-shadow: 0 0 5px rgba(255, 170, 29, 0.7);
}
.led-bar.lit-red {
  background: var(--led-red);
  box-shadow: 0 0 5px rgba(255, 69, 58, 0.8);
}

.db-badge {
  font-size: 9px;
  color: #6a6f73;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-left: 2px;
}

/* Reduced motion & paused */
:root[data-paused=true] * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Standalone controller (only visible when not in iframe) */
.standalone-deck {
  display: none;
  margin-top: 36px;
  background: var(--chassis);
  border: 1px solid var(--chassis-border);
  padding: 12px 18px;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  gap: 12px;
  align-items: center;
  font-size: 12px;
}
.standalone-deck.active {
  display: flex;
  flex-wrap: wrap;
}
.standalone-deck button {
  padding: 6px 12px;
  border-radius: 4px;
  border: 1px solid var(--chassis-border);
  background: transparent;
  color: #fff;
  font: inherit;
  cursor: pointer;
}
.standalone-deck button:hover {
  background: rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<div class="preview-stage">
  <div class="hifi-pill" id="pill" data-state="listening">
    <!-- REC Marker -->
    <div class="rec-section" aria-hidden="true">
      <div class="rec-led"></div>
      <span class="rec-label">REC</span>
    </div>

    <!-- Center Monospace Status -->
    <div class="display-section">
      <span id="label-text">LISTENING</span>
    </div>

    <!-- Segmented 8-Stage LED VU Meter -->
    <div class="meter-array" id="meter" aria-hidden="true">
      <div class="led-bar" data-type="green"></div>
      <div class="led-bar" data-type="green"></div>
      <div class="led-bar" data-type="green"></div>
      <div class="led-bar" data-type="green"></div>
      <div class="led-bar" data-type="amber"></div>
      <div class="led-bar" data-type="amber"></div>
      <div class="led-bar" data-type="red"></div>
      <div class="led-bar" data-type="red"></div>
      <span class="db-badge" id="db-readout">-12dB</span>
    </div>
  </div>

  <!-- Standalone test controls (shown when opened directly) -->
  <div class="standalone-deck" id="deck">
    <span><strong>Tactile Hi-Fi · 機械音量計 演示</strong></span>
    <button type="button" onclick="setDemoState('listening')">Listening</button>
    <button type="button" onclick="setDemoState('transcribing')">Transcribing</button>
    <button type="button" onclick="setDemoState('transforming')">Transforming</button>
    <button type="button" onclick="setDemoState('searching')">Searching</button>
    <button type="button" onclick="setDemoState('done')">Done</button>
    <button type="button" onclick="setDemoState('failed')">Failed</button>
  </div>
</div>

<script>
(function() {
  var pill = document.getElementById('pill');
  var label = document.getElementById('label-text');
  var meterBars = document.querySelectorAll('.led-bar');
  var dbReadout = document.getElementById('db-readout');

  var currentState = 'listening';
  var currentLevel = 0.55;
  var currentScenario = 'dictate';
  var smoothedLevel = 0;
  var isMotion = true;

  var samples = {
    dictate: '將呢個 function 改成 async。',
    rewrite: 'I’ll get back to you tomorrow.',
    search: '上網查下 exponential backoff。'
  };

  function updateState(state, scenario) {
    currentState = state || 'listening';
    if (scenario) currentScenario = scenario;
    pill.setAttribute('data-state', currentState);

    switch (currentState) {
      case 'appear':
      case 'listening':
        label.textContent = 'LISTENING...';
        break;
      case 'transcribing':
        label.textContent = 'PROCESSING...';
        break;
      case 'transforming':
        label.textContent = 'REWRITING...';
        break;
      case 'searching':
        label.textContent = 'SEARCHING...';
        break;
      case 'done':
        label.textContent = samples[currentScenario] || 'DONE';
        break;
      case 'failed':
        label.textContent = 'ERROR // RETRY';
        break;
    }
  }

  function tick() {
    if (!isMotion) {
      requestAnimationFrame(tick);
      return;
    }

    var targetLevel = (currentState === 'listening') ? currentLevel : 0;
    var attack = 0.65;
    var decay = 0.12;
    smoothedLevel = smoothedLevel < targetLevel
      ? smoothedLevel + attack * (targetLevel - smoothedLevel)
      : smoothedLevel + decay * (targetLevel - smoothedLevel);

    // Calculate discrete lit stages (0 to 8)
    var litCount = Math.round(smoothedLevel * 8);
    if (currentState === 'listening' && litCount === 0) litCount = 1; // Idle floor

    for (var i = 0; i < meterBars.length; i++) {
      var bar = meterBars[i];
      var type = bar.getAttribute('data-type');
      if (i < litCount) {
        bar.className = 'led-bar lit-' + type;
      } else {
        bar.className = 'led-bar';
      }
    }

    var db = -24 + Math.round(smoothedLevel * 24);
    dbReadout.textContent = (db >= 0 ? '+' : '') + db + 'dB';

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  window.addEventListener('message', function(event) {
    var m = event.data;
    if (!m || m.type !== 'pill-state') return;

    if (m.theme === 'light' || m.theme === 'dark') {
      document.documentElement.dataset.theme = m.theme;
    }
    isMotion = (m.motion !== false && m.active !== false);
    document.documentElement.dataset.paused = String(!isMotion);

    if (typeof m.level === 'number' && isFinite(m.level)) {
      currentLevel = Math.max(0, Math.min(1, m.level));
    }

    updateState(m.state, m.scenario);
  });

  // Standalone mode helper
  window.setDemoState = function(st) {
    updateState(st, currentScenario);
  };

  if (window.parent === window) {
    var deck = document.getElementById('deck');
    if (deck) deck.classList.add('active');
  }

  if (window.parent !== window) {
    window.parent.postMessage({ type: 'pill-ready', id: 'inflow-tactile-hifi' }, '*');
  }
})();
</script>
</body>
</html>
